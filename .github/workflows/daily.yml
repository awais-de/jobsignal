name: daily-pipeline

on:
  schedule:
    - cron: '17 5 * * *'   # 05:17 UTC: ~06:20 CET (winter) / ~07:20 CEST (summer)
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      # Phase 0: dry run only. Drop --dry-run when Phase 1 is accepted.
      - run: python -m pipeline.run --dry-run
        env:
          PROFILE_YAML: ${{ secrets.PROFILE_YAML }}
