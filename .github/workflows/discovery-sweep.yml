name: discovery-sweep

# One-off (owner request 2026-10-21): checks every relevant company (relevance groups A and B) for a career
# site the pipeline can read, 8 at a time, within 45 minutes. Group C is never checked. Logs counts only.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: daily-pipeline        # never overlaps a daily run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pipeline.run --discovery-sweep
        env:
          PROFILE_YAML: ${{ secrets.PROFILE_YAML }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
