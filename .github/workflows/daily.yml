name: daily-pipeline

on:
  schedule:
    - cron: '17 5 * * *'   # 05:17 UTC: ~06:20 CET (winter) / ~07:20 CEST (summer)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (write nothing, send nothing)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pipeline.run ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          PROFILE_YAML: ${{ secrets.PROFILE_YAML }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
