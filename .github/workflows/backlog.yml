name: extract-backlog

# Manual: extract and rank stored postings that are still pending. No fetch, no email.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (call the LLM but write nothing)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-pipeline        # never overlaps a daily run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pipeline.run --backlog-only ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          PROFILE_YAML: ${{ secrets.PROFILE_YAML }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
