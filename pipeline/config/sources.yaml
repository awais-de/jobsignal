# Source settings. Public: no personal values here.
# Search terms live in the (private) profile under `search_terms`.

ba_api:
  enabled: true
  published_within_days: 2     # matches freshness_hours: 48
  page_size: 100
  max_pages_per_term: 5
  request_delay_seconds: 0.5   # polite pacing between requests
  max_detail_fetches: 150      # per run; only for postings that passed the filters

arbeitnow:
  # Free public API, no key (terms: don't abuse; link back appreciated). Europe-wide, newest first.
  enabled: true
  published_within_days: 2     # pages are read only until jobs are older than this
  max_pages: 5                 # 325 jobs per page
  request_delay_seconds: 1.0

careers:
  # Company watchlist (the companies themselves are in the private profile under `watchlist`).
  request_delay_seconds: 1.0       # polite pacing per request
  max_new_pages_per_company: 120   # cap on new job pages fetched per company per run

discovery:
  # Company discovery (spec 7.2): employers seen with a job in Germany are probed on common ATS.
  enabled: true
  companies_per_run: 50        # STARTING VALUE: ~1 s per company (systems asked in parallel)
  max_seconds_per_run: 300     # hard time budget for probing
  retry_not_found_days: 30     # companies without a verified ATS are retried monthly
  # Staffing agencies post for other employers: never probed (spec 7.8). Lower-case substrings.
  agencies: [hays, randstad, adecco, manpower, experis, ferchau, brunel, gulp, amadeus fire, robert half,
             michael page, page personnel, dis ag, persona service, orizon, tempton, jobtimum, akkodis,
             modis, solcom, etengo, freelancermap, talentschuppen, piening, timepartner, i.k. hofmann,
             instaffo, hapeko, grinnberg]
