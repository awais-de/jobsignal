# LLM providers and routing (spec 8). Public: no keys here, only env var names.

providers:
  groq:
    enabled: true
    api_key_env: GROQ_API_KEY
  gemini:
    # Paid tier only (EEA terms for unpaid use). Enable after setting up billing in AI Studio.
    enabled: false
    api_key_env: GEMINI_API_KEY

stages:
  jd_extraction:
    prompt_version: 'jd-v2'   # bump on any prompt change: invalidates the cache
    max_calls_per_run: 80          # hard cap per run, across providers
    explore_per_run: 20            # STARTING VALUE: explore-lane jobs analysed per run (best skill overlap
                                   # first); the rest stay pending for later runs (core jobs always first)
    max_input_chars: 8000          # description is trimmed to this before sending
    providers:                     # tried in order; falls through on rate limit / errors
      - { provider: groq,   model: 'openai/gpt-oss-120b' }
      - { provider: groq,   model: 'openai/gpt-oss-20b' }
      - { provider: gemini, model: 'gemini-3.5-flash-lite' }

  page_extraction:
    # Job pages without JSON-LD (spec 7.1 tier 3, technique 2): is it a job, and its title/location.
    prompt_version: 'page-v1'
    max_calls_per_run: 30
    max_input_chars: 8000
    providers:
      - { provider: groq,   model: 'openai/gpt-oss-20b' }
      - { provider: groq,   model: 'openai/gpt-oss-120b' }
