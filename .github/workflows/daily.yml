name: daily-pipeline

on:
  schedule:
    # GitHub can delay or drop scheduled runs, so there are three; the first that runs does the
    # work and the others exit early (see pipeline/run.py). ~07:20 / 08:50 / 10:20 German summer time.
    - cron: '17 5 * * *'
    - cron: '47 6 * * *'
    - cron: '17 8 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (write nothing, send nothing)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60          # more search terms + free-tier AI pacing: runs take ~15-30 min
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pipeline.run ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          PROFILE_YAML: ${{ secrets.PROFILE_YAML }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          ACTION_LINK_SECRET: ${{ secrets.ACTION_LINK_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # unused until enabled in llm.yaml
          APP_URL: ${{ vars.APP_URL }}   # web app address; digest has no Apply/Skip links until set
